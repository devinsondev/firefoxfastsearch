name: Check extension
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python scripts/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: firefoxfastsearch-amo-linux
          path: dist/*.zip
          if-no-files-found: error

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate ZIP using Python on Windows
        run: |
          python scripts/package.py
          python scripts/verify_package.py
      - name: Build and validate ZIP using Windows PowerShell
        shell: powershell
        run: |
          & .\scripts\package.ps1
      - name: Verify the PowerShell ZIP against source files
        run: python scripts/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: firefoxfastsearch-amo-windows
          path: dist/*.zip
          if-no-files-found: error
